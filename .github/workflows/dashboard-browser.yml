name: Dashboard browser tests

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Dashboard browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --locked --group e2e

      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends caddy

      - name: Install Chromium and WebKit
        run: uv run --locked --group e2e playwright install --with-deps chromium webkit

      - name: Test the dashboard in browsers
        run: uv run --locked --group e2e pytest --no-cov tests/e2e

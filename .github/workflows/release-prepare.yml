name: Release (prepare)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest -m "not integration"

      - name: Bump version
        id: bump
        run: |
          uv version --bump ${{ inputs.bump }}
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      # NOTE: this uses the default GITHUB_TOKEN, so the pull_request-triggered
      # CI run for the PR opened below sits in an approval-required state —
      # a user with write access must approve it in the PR's merge box before
      # it (and integration tests) run. The lint, type check, and test steps
      # above run against `main` as a partial substitute in the meantime. See
      # "Releasing" in README.md for details and the real fix.
      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          branch="release/v${version}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add pyproject.toml uv.lock
          git commit -m "chore: release v${version}"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release v${version}" \
            --body "Version bump for release v${version}. Merging this PR tags the merge commit and publishes the GitHub release."

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init and codeql-action/analyze must stay on the same
      # version; bumped separately, each PR fails CodeQL until the other lands.
      codeql-action:
        patterns:
          - "github/codeql-action*"

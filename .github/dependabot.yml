version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all minor/patch bumps; major bumps still get their own PR.
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init and codeql-action/analyze must stay on the same
      # version; bumped separately, each PR fails CodeQL until the other lands.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # A dependency goes in the first group it matches, so this catch-all
      # must stay below codeql-action.
      github-actions:
        patterns:
          - "*"

[project]
name = "messy-weather-sports-bot"
version = "4.2.0"
description = "Posts messy NFL and Top 25 college football game-day weather to social media"
authors = [
    { name = "Anthony Panettiere" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "atproto>=0.0.72",
    "flask>=3.1,<4",
    "flask-wtf>=1.2,<2",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9.1.4",
    "waitress>=3.0.2,<4",
]

[project.scripts]
messy-weather-dashboard = "messy_weather_sports_bot.dashboard:main"
messy-weather-collector = "messy_weather_sports_bot.collector_cli:main"
messy-weather-nfl-bot = "messy_weather_sports_bot.nfl:main"
messy-weather-cfb-bot = "messy_weather_sports_bot.cfb:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
e2e = [
    "playwright>=1.52,<2",
]

[tool.alembic]
script_location = "%(here)s/src/messy_weather_sports_bot/migrations"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--cov --cov-report=term-missing"
markers = [
    "integration: exercises real external APIs (network required)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 80

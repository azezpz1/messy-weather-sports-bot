repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: check-pre-push
        name: check (lint, format, types, unit tests)
        entry: scripts/check.sh -m "not integration"
        language: system
        pass_filenames: false
        stages: [pre-push]
